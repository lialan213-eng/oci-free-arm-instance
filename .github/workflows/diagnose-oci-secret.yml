name: Diagnose OCI Secret Structure

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report secret structure without exposing values
        env:
          OCI_SECRET: ${{ secrets.OCI }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import base64

          value = os.environ.get("OCI_SECRET", "")
          stripped = value.strip()
          nonempty_lines = [line.strip() for line in value.splitlines() if line.strip()]
          compact = "".join(nonempty_lines)

          try:
              decoded = base64.b64decode(compact, validate=True)
          except (ValueError, base64.binascii.Error):
              decoded = b""

          report = {
              "present": bool(stripped),
              "line_count": len(value.splitlines()),
              "looks_like_private_key": "BEGIN PRIVATE KEY" in value or "BEGIN RSA PRIVATE KEY" in value,
              "looks_like_encrypted_private_key": "BEGIN ENCRYPTED PRIVATE KEY" in value,
              "looks_like_openssh_private_key": "BEGIN OPENSSH PRIVATE KEY" in value,
              "looks_like_putty_private_key": stripped.startswith("PuTTY-User-Key-File-") and "Private-Lines:" in value,
              "contains_any_pem_marker": bool(re.search(r"-----BEGIN [^-\r\n]+-----", value)),
              "looks_like_base64_der": bool(decoded) and decoded.startswith(b"\x30"),
              "looks_like_oci_config": "[DEFAULT]" in value,
              "contains_user_ocid": "ocid1.user." in value,
              "contains_tenancy_ocid": "ocid1.tenancy." in value,
              "contains_subnet_ocid": "ocid1.subnet." in value,
              "contains_image_ocid": "ocid1.image." in value,
              "config_fields": [
                  field
                  for field in ("user", "fingerprint", "key_file", "tenancy", "region")
                  if re.search(rf"(?m)^\s*{field}\s*=", value)
              ],
              "environment_fields": [
                  field
                  for field in (
                      "OCI_CLI_USER",
                      "OCI_CLI_FINGERPRINT",
                      "OCI_CLI_KEY_CONTENT",
                      "OCI_CLI_TENANCY",
                      "OCI_CLI_REGION",
                      "OCI_COMPARTMENT_ID",
                      "OCI_SUBNET_ID",
                      "AD_NAME",
                      "IMAGE_ID",
                      "SSH_PUBLIC_KEY",
                  )
                  if re.search(rf"(?m)^\s*(?:export\s+)?{field}\s*[=:]", value)
              ],
          }

          try:
              parsed = json.loads(stripped)
          except (json.JSONDecodeError, TypeError):
              report["json_type"] = None
              report["json_keys"] = []
          else:
              report["json_type"] = type(parsed).__name__
              report["json_keys"] = sorted(parsed.keys()) if isinstance(parsed, dict) else []

          print(json.dumps(report, indent=2))
          PY
