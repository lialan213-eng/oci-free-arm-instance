name: Diagnose OCI Secret Structure

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report secret structure without exposing values
        env:
          OCI_SECRET: ${{ secrets.OCI }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          value = os.environ.get("OCI_SECRET", "")
          stripped = value.strip()
          report = {
              "present": bool(stripped),
              "line_count": len(value.splitlines()),
              "looks_like_private_key": "BEGIN PRIVATE KEY" in value or "BEGIN RSA PRIVATE KEY" in value,
              "looks_like_oci_config": "[DEFAULT]" in value,
              "config_fields": [
                  field
                  for field in ("user", "fingerprint", "key_file", "tenancy", "region")
                  if re.search(rf"(?m)^\s*{field}\s*=", value)
              ],
          }

          try:
              parsed = json.loads(stripped)
          except (json.JSONDecodeError, TypeError):
              report["json_type"] = None
              report["json_keys"] = []
          else:
              report["json_type"] = type(parsed).__name__
              report["json_keys"] = sorted(parsed.keys()) if isinstance(parsed, dict) else []

          print(json.dumps(report, indent=2))
          PY
