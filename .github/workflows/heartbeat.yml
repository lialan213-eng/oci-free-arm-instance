name: Daily Summary - OCI VM Monitor

on:
  schedule:
    # 14:00 Asia/Shanghai every day (GitHub Actions cron uses UTC).
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Send Daily Summary to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read

    steps:
      - name: Fetch the last 24 hours and notify Discord
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          python3 - <<'PY' | curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @- \
          && echo "Discord notified" || { echo "Discord webhook failed"; exit 1; }
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone, timedelta

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          workflow_id = "create-vm.yml"
          api_root = f"https://api.github.com/repos/{repo}"

          def gh_request(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def gh_json(url):
              return json.loads(gh_request(url))

          def created_at(run):
              return datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))

          now_utc = datetime.now(timezone.utc)
          cutoff24 = now_utc - timedelta(hours=24)

          workflow = gh_json(f"{api_root}/actions/workflows/{workflow_id}")
          runs24 = []
          page = 1
          while True:
              data = gh_json(
                  f"{api_root}/actions/workflows/{workflow_id}/runs"
                  f"?per_page=100&page={page}"
              )
              page_runs = data.get("workflow_runs", [])
              runs24.extend(run for run in page_runs if created_at(run) >= cutoff24)
              if len(page_runs) < 100 or created_at(page_runs[-1]) < cutoff24:
                  break
              page += 1

          counts = {
              "created": 0,
              "capacity": 0,
              "quota": 0,
              "other_oci": 0,
              "existing": 0,
              "no_launch": 0,
              "pending": 0,
              "logs_unavailable": 0,
          }
          launch_count = 0
          latest_result = "无运行记录"

          marker = re.compile(
              r"OCI launch response: result=(\w+) code=([^\s]+) "
              r"status=([^\s]+) request_id=([^\s]+) message=(.*)"
          )

          def classify(run):
              if run.get("status") != "completed":
                  return "pending", False, "正在运行"

              try:
                  archive = gh_request(f"{api_root}/actions/runs/{run['id']}/logs")
                  with zipfile.ZipFile(io.BytesIO(archive)) as logs_zip:
                      logs = "\n".join(
                          logs_zip.read(name).decode("utf-8", errors="replace")
                          for name in logs_zip.namelist()
                          if not name.endswith("/")
                      )
              except Exception:
                  return (
                      "logs_unavailable",
                      False,
                      f"日志不可用 ({run.get('conclusion') or 'unknown'})",
                  )

              matches = list(marker.finditer(logs))
              if matches:
                  result, code, _status, _request_id, _message = matches[-1].groups()
                  if result == "created":
                      return "created", True, "创建成功"
                  elif result == "capacity":
                      return "capacity", True, "主机容量不足"
                  elif code == "LimitExceeded":
                      return "quota", True, "A1 配额不足"
                  return "other_oci", True, f"OCI 错误 ({code})"
              elif "Existing coolify-vm instance found; no launch request was sent." in logs:
                  return "existing", False, "已存在 coolify-vm"
              return (
                  "no_launch",
                  False,
                  f"未到创建步骤 ({run.get('conclusion') or 'unknown'})",
              )

          with ThreadPoolExecutor(max_workers=8) as executor:
              classifications = list(executor.map(classify, runs24))

          for key, launched, _label in classifications:
              counts[key] += 1
              launch_count += int(launched)

          if classifications:
              latest_result = classifications[0][2]

          workflow_state = workflow.get("state", "unknown")
          now_cst = now_utc + timedelta(hours=8)
          last_time = (
              (created_at(runs24[0]) + timedelta(hours=8)).strftime("%Y-%m-%d %H:%M")
              if runs24 else "N/A"
          )

          msg = (
              "**OCI 抢机：过去 24 小时汇总**\n"
              f"统计时间（北京时间）：**{now_cst.strftime('%Y-%m-%d %H:%M')}**\n\n"
              f"工作流状态：**{workflow_state}**\n"
              f"运行次数：**{len(runs24)}**\n"
              f"真实提交 OCI：**{launch_count}**\n"
              f"创建成功：**{counts['created']}**\n"
              f"主机容量不足：**{counts['capacity']}**\n"
              f"A1 配额不足：**{counts['quota']}**\n"
              f"其他 OCI 错误：**{counts['other_oci']}**\n"
              f"已存在实例：**{counts['existing']}**\n"
              f"未到创建步骤：**{counts['no_launch']}**\n"
              f"正在运行：**{counts['pending']}**\n"
              f"日志不可用：**{counts['logs_unavailable']}**\n\n"
              f"最近一次（{last_time}）：**{latest_result}**\n"
              "创建成功或发现已有 coolify-vm 后，抢机工作流会自动停用。"
          )

          print(json.dumps({"content": msg}))
          PY
