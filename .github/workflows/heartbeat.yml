name: Heartbeat - OCI VM Monitor

on:
  schedule:
    # Every 2 hours during the original VM creation window.
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Send Heartbeat to Discord
    runs-on: ubuntu-latest
    permissions:
      actions: read   # Required to query workflow runs via GITHUB_TOKEN

    steps:
      - name: Fetch stats and notify Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          python3 - <<'PY' | curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @- \
          && echo "Discord notified" || { echo "Discord webhook failed"; exit 1; }
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          token   = os.environ["GITHUB_TOKEN"]
          repo    = os.environ["GITHUB_REPOSITORY"]
          wf_id   = "create-vm.yml"

          def gh_get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          workflow = gh_get(f"https://api.github.com/repos/{repo}/actions/workflows/{wf_id}")
          data  = gh_get(f"https://api.github.com/repos/{repo}/actions/workflows/{wf_id}/runs?per_page=100")
          total = data["total_count"]
          runs  = data["workflow_runs"]

          now_utc  = datetime.now(timezone.utc)
          cutoff24 = now_utc - timedelta(hours=24)
          cutoff2  = now_utc - timedelta(hours=2)

          runs24 = [r for r in runs
                    if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) > cutoff24]
          runs2  = [r for r in runs
                    if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) > cutoff2]

          last       = runs[0] if runs else None
          last_time  = last["created_at"].replace("T", " ").replace("Z", " UTC") if last else "N/A"
          last_concl = last["conclusion"] if last else "N/A"
          last_icon  = "✅" if last_concl == "success" else ("⏳" if last_concl is None else "❌")
          workflow_state = workflow.get("state", "unknown")
          scheduler_icon = "✅" if workflow_state == "active" else "⛔"

          now_cst = now_utc + timedelta(hours=8)

          msg = (
              "🤖 **OCI VM 尝试监控 — 心跳报告**\n"
              f"⏰ 当前时间 (CST): **{now_cst.strftime('%Y-%m-%d %H:%M')}**\n"
              f"\n"
              f"📊 总尝试次数: **{total}**\n"
              f"📈 过去 24 小时: **{len(runs24)}** 次\n"
              f"🕑 过去 2 小时: **{len(runs2)}** 次\n"
              f"\n"
              f"{scheduler_icon} 创建工作流状态: **{workflow_state}**\n"
              f"{last_icon} 最近一次运行: `{last_time}`\n"
              f"   结果: **{last_concl}**\n"
              f"\n"
              f"_容量不足会显示为失败；创建成功后工作流会自动停用。_"
          )

          print(json.dumps({"content": msg}))
          PY
