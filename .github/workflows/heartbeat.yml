name: Heartbeat - OCI VM Monitor

on:
  schedule:
    # Every 2 hours, aligned with the VM creation window (03:00–18:00 UTC = 11:00 AM–2:00 AM CST)
    - cron: '0 3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Send Heartbeat to Discord
    runs-on: ubuntu-latest
    permissions:
      actions: read   # Required to query workflow runs via GITHUB_TOKEN

    steps:
      - name: Fetch stats and notify Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          token    = os.environ["GITHUB_TOKEN"]
          webhook  = os.environ.get("DISCORD_WEBHOOK_URL", "")
          repo     = "lialan213-eng/oci-free-arm-instance"
          wf_id    = "283490734"   # create-vm workflow numeric ID

          def gh_get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Fetch up to 100 most-recent runs (enough for last ~24 h)
          data  = gh_get(f"https://api.github.com/repos/{repo}/actions/workflows/{wf_id}/runs?per_page=100")
          total = data["total_count"]
          runs  = data["workflow_runs"]

          now_utc  = datetime.now(timezone.utc)
          cutoff24 = now_utc - timedelta(hours=24)
          cutoff2  = now_utc - timedelta(hours=2)

          runs24 = [r for r in runs
                    if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) > cutoff24]
          runs2  = [r for r in runs
                    if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) > cutoff2]

          last       = runs[0] if runs else None
          last_time  = last["created_at"].replace("T", " ").replace("Z", " UTC") if last else "N/A"
          last_concl = last["conclusion"] if last else "N/A"
          last_icon  = "✅" if last_concl == "success" else ("⏳" if last_concl is None else "❌")

          now_cst = now_utc + timedelta(hours=8)

          msg = (
              "🤖 **OCI VM 尝试监控 — 心跳报告**\n"
              f"⏰ 当前时间 (CST): **{now_cst.strftime('%Y-%m-%d %H:%M')}**\n"
              f"\n"
              f"📊 总尝试次数: **{total}**\n"
              f"📈 过去 24 小时: **{len(runs24)}** 次\n"
              f"🕑 过去 2 小时: **{len(runs2)}** 次\n"
              f"\n"
              f"{last_icon} 最近一次运行: `{last_time}`\n"
              f"   结果: **{last_concl}**\n"
              f"\n"
              f"_调度器仍在运行中，继续等待资源释放…_"
          )

          if not webhook:
              print("DISCORD_WEBHOOK_URL not set — printing message instead:")
              print(msg)
              raise SystemExit(0)

          payload = json.dumps({"content": msg}).encode()
          req = urllib.request.Request(
              webhook, data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"Discord notified (HTTP {r.status})")
          except urllib.error.HTTPError as e:
              print(f"Discord webhook failed: {e.code} {e.reason}")
              raise SystemExit(1)
          PY
