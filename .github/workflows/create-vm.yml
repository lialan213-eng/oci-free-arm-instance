name: Try to Create OCI VM

on:
  schedule:
    # Run around the clock, offset from the top of the hour to reduce scheduler delays.
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-vm-creation
  cancel-in-progress: false

jobs:
  create-instance:
    name: Attempt OCI VM Creation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      SUPPRESS_LABEL_WARNING: "True"

    steps:
      - name: Cache OCI CLI
        id: cache-oci
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: oci-cli-${{ runner.os }}-v2

      - name: Install OCI CLI
        if: steps.cache-oci.outputs.cache-hit != 'true'
        run: python3 -m pip install --user oci-cli --quiet

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Parse and validate bundled OCI configuration
        env:
          OCI_BUNDLE: ${{ secrets.OCI }}
          OCI_KEY_OVERRIDE: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          expected = (
              "OCI_CLI_USER",
              "OCI_CLI_FINGERPRINT",
              "OCI_CLI_KEY_CONTENT",
              "OCI_CLI_TENANCY",
              "OCI_CLI_REGION",
              "OCI_COMPARTMENT_ID",
              "OCI_SUBNET_ID",
              "AD_NAME",
              "IMAGE_ID",
              "SSH_PUBLIC_KEY",
          )

          bundle = os.environ.get("OCI_BUNDLE", "").replace("\r\n", "\n")
          if not bundle.strip():
              raise SystemExit("The OCI repository secret is empty")

          key_pattern = "|".join(re.escape(name) for name in expected)
          matches = list(re.finditer(
              rf"(?m)^\s*(?:export\s+)?({key_pattern})\s*([=:])\s*",
              bundle,
          ))
          values = {}

          for index, match in enumerate(matches):
              end = matches[index + 1].start() if index + 1 < len(matches) else len(bundle)
              raw = bundle[match.end():end].strip()

              if match.group(2) == ":" and re.match(r"^[|>][-+]?\s*(?:\n|$)", raw):
                  raw = re.sub(r"^[|>][-+]?\s*", "", raw, count=1)
                  raw = "\n".join(line.lstrip() for line in raw.splitlines())

              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
                  if raw[0] == '"':
                      try:
                          raw = json.loads(raw)
                      except json.JSONDecodeError:
                          raw = raw[1:-1]
                  else:
                      raw = raw[1:-1]

              values[match.group(1)] = raw.strip()

          missing = [name for name in expected if not values.get(name)]
          if missing:
              raise SystemExit("Missing OCI bundle fields: " + ", ".join(missing))

          key_override = os.environ.get("OCI_KEY_OVERRIDE", "").strip()
          if key_override:
              values["OCI_CLI_KEY_CONTENT"] = key_override

          for name in expected:
              value = values[name]
              print(f"::add-mask::{value}")
              for line in value.splitlines():
                  if len(line.strip()) >= 4:
                      print(f"::add-mask::{line.strip()}")

          validations = {
              "OCI_CLI_USER": r"^ocid1\.user\.",
              "OCI_CLI_TENANCY": r"^ocid1\.tenancy\.",
              "OCI_COMPARTMENT_ID": r"^ocid1\.(?:tenancy|compartment)\.",
              "OCI_SUBNET_ID": r"^ocid1\.subnet\.",
              "IMAGE_ID": r"^ocid1\.image\.",
              "OCI_CLI_REGION": r"^[a-z]{2}-[a-z0-9-]+-\d$",
              "AD_NAME": r"^[A-Za-z0-9]+:[A-Za-z0-9-]+-AD-\d$",
              "OCI_CLI_FINGERPRINT": r"^(?:[0-9a-fA-F]{2}:){15}[0-9a-fA-F]{2}$",
              "SSH_PUBLIC_KEY": r"^(?:ssh-rsa|ssh-ed25519)\s+",
          }
          invalid = [
              name for name, pattern in validations.items()
              if not re.search(pattern, values[name].strip())
          ]
          if invalid:
              raise SystemExit("Invalid OCI bundle fields: " + ", ".join(invalid))

          key_content = values["OCI_CLI_KEY_CONTENT"].replace("\\n", "\n").strip()
          if not re.search(r"-----BEGIN [^-\r\n]*PRIVATE KEY-----", key_content):
              try:
                  decoded = base64.b64decode("".join(key_content.split()), validate=True)
                  decoded_text = decoded.decode("utf-8")
              except (ValueError, UnicodeDecodeError, base64.binascii.Error):
                  decoded_text = ""
              if re.search(r"-----BEGIN [^-\r\n]*PRIVATE KEY-----", decoded_text):
                  key_content = decoded_text.strip()

          if not re.search(r"-----BEGIN [^-\r\n]*PRIVATE KEY-----", key_content):
              raise SystemExit("OCI_CLI_KEY_CONTENT is not a PEM private key")

          oci_dir = Path.home() / ".oci"
          oci_dir.mkdir(mode=0o700, exist_ok=True)
          key_path = oci_dir / "oci_api_key.pem"
          key_path.write_text(key_content + "\n", encoding="utf-8")
          key_path.chmod(0o600)

          config_path = oci_dir / "config"
          config_path.write_text(
              "[DEFAULT]\n"
              f"user={values['OCI_CLI_USER']}\n"
              f"fingerprint={values['OCI_CLI_FINGERPRINT']}\n"
              f"key_file={key_path}\n"
              f"tenancy={values['OCI_CLI_TENANCY']}\n"
              f"region={values['OCI_CLI_REGION']}\n",
              encoding="utf-8",
          )
          config_path.chmod(0o600)

          ssh_path = Path("/tmp/oci_ssh_key.pub")
          ssh_path.write_text(values["SSH_PUBLIC_KEY"].strip() + "\n", encoding="utf-8")
          ssh_path.chmod(0o600)

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as env_file:
              for name in ("OCI_COMPARTMENT_ID", "OCI_SUBNET_ID", "AD_NAME", "IMAGE_ID"):
                  env_file.write(f"{name}={values[name]}\n")

          print("Bundled OCI configuration parsed and validated")
          PY

      - name: Validate private key
        run: openssl pkey -in ~/.oci/oci_api_key.pem -check -noout

      - name: Authenticate with OCI
        run: |
          NAMESPACE=$(oci os ns get --query data --raw-output)
          if [ -z "$NAMESPACE" ]; then
            echo "OCI authentication returned an empty namespace"
            exit 1
          fi
          echo "OCI authentication succeeded"

      - name: Check for an existing instance
        id: existing
        run: |
          set +e
          oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --all \
            --output json \
            > /tmp/oci-instances.json 2> /tmp/oci-instances.stderr
          LIST_EXIT=$?
          set -e
          echo "OCI instance list diagnostics: exit=$LIST_EXIT stdout_bytes=$(wc -c < /tmp/oci-instances.json) stderr_bytes=$(wc -c < /tmp/oci-instances.stderr)"
          if [ "$LIST_EXIT" != "0" ]; then
            echo "OCI instance list request failed"
            exit "$LIST_EXIT"
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          body = Path("/tmp/oci-instances.json").read_text(encoding="utf-8", errors="replace")
          payload = [] if not body.strip() else None
          for offset, character in enumerate(body):
              if character not in "[{":
                  continue
              try:
                  payload, _ = json.JSONDecoder().raw_decode(body[offset:])
                  break
              except json.JSONDecodeError:
                  continue
          if payload is None and body.strip() == "null":
              payload = []
          if payload is None:
              raise SystemExit("OCI instance list did not contain an object or array response")
          instances = payload.get("data", []) if isinstance(payload, dict) else payload
          active = [
              instance
              for instance in instances
              if instance.get("display-name") == "coolify-vm"
              and instance.get("lifecycle-state") != "TERMINATED"
          ]

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"count={len(active)}\n")

          if active:
              details = [
                  {
                      "state": instance.get("lifecycle-state"),
                      "shape": instance.get("shape"),
                      "ocpus": (instance.get("shape-config") or {}).get("ocpus"),
                      "memory_gb": (instance.get("shape-config") or {}).get("memory-in-gbs"),
                      "created": instance.get("time-created"),
                  }
                  for instance in active
              ]
              print("Existing coolify-vm instances: " + json.dumps(details))
          else:
              print("No active coolify-vm instance exists")
          PY

      - name: Launch VM
        id: launch
        if: steps.existing.outputs.count == '0'
        env:
          SHAPE_CONFIG: '{"ocpus":2,"memoryInGBs":12}'
        run: |
          set +e
          oci compute instance launch \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config "$SHAPE_CONFIG" \
            --subnet-id "$OCI_SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file /tmp/oci_ssh_key.pub \
            --display-name "coolify-vm" \
            --boot-volume-size-in-gbs 100 \
            > /tmp/oci-launch-response.log 2>&1
          EXIT_CODE=$?
          set -e

          EXIT_CODE="$EXIT_CODE" python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          body = Path("/tmp/oci-launch-response.log").read_text(encoding="utf-8", errors="replace")
          exit_code = int(os.environ["EXIT_CODE"])
          parsed = {}

          for offset, character in enumerate(body):
              if character != "{":
                  continue
              try:
                  parsed, _ = json.JSONDecoder().raw_decode(body[offset:])
                  break
              except json.JSONDecodeError:
                  continue

          if exit_code == 0:
              instance = parsed.get("data", parsed)
              instance_id = instance.get("id", "")
              if instance_id:
                  print(f"::add-mask::{instance_id}")
              result = "created"
              code = "OK"
              status = 200
              message = "OCI accepted the VM launch request"
              request_id = parsed.get("opc-request-id", "not-returned")
          else:
              code = parsed.get("code", "UnclassifiedError")
              status = parsed.get("status", "unknown")
              message = parsed.get("message", "OCI CLI failed without a structured service response")
              request_id = parsed.get("opc-request-id", "not-returned")
              normalized = f"{code} {message}".lower()
              result = "capacity" if "out of host capacity" in normalized else "fatal"

          summary = (
              f"OCI launch response: result={result} code={code} "
              f"status={status} request_id={request_id} message={message}"
          )
          print(summary)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"result={result}\n")
              output.write(f"code={code}\n")
              output.write(f"status={status}\n")
              output.write(f"request_id={request_id}\n")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as report:
              report.write("## OCI VM launch result\n\n")
              report.write(summary + "\n")

          if result == "fatal":
              sys.exit(2)
          PY

      - name: Record existing instance as success
        id: existing-result
        if: steps.existing.outputs.count != '0'
        run: |
          echo "result=existing" >> "$GITHUB_OUTPUT"
          echo "Existing coolify-vm instance found; no launch request was sent." >> "$GITHUB_STEP_SUMMARY"

      - name: Disable creation workflow after success
        if: steps.launch.outputs.result == 'created' || steps.existing-result.outputs.result == 'existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PUT \
            "repos/${{ github.repository }}/actions/workflows/create-vm.yml/disable"
          echo "Creation workflow disabled after success"

      - name: Mark capacity miss
        if: steps.launch.outputs.result == 'capacity'
        run: |
          echo "OCI accepted the launch request but reported no host capacity"
          exit 1
